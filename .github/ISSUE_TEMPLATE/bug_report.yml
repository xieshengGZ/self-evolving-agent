name: Bug report
description: Something broke or behaved unexpectedly
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste API keys, web tokens, private hostnames, or production logs.
        For security issues, use the private reporting process in SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the expected result and the actual result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact tokens, keys, and private paths.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v1.2.0
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - install.sh
        - manual / systemd
        - development checkout
        - other
    validations:
      required: true
