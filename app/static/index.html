<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>agent-services</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
<link rel="shortcut icon" href="/favicon.ico?v=2" />
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1115;
    color: #e6e6e6;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    background: #171a21;
    border-bottom: 1px solid #262b36;
    flex-wrap: wrap;
    flex: 0 0 auto;
  }
  header h1 {
    font-size: 15px;
    margin: 0 12px 0 0;
    font-weight: 600;
    color: #9ecbff;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .brand-icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    display: block;
  }
  input, button, textarea { font-family: inherit; font-size: 13px; }
  input[type="password"], input[type="text"] {
    background: #0f1115;
    border: 1px solid #2c3340;
    color: #e6e6e6;
    padding: 6px 8px;
    border-radius: 6px;
    outline: none;
  }
  input[type="password"]:focus, input[type="text"]:focus { border-color: #3b82f6; }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #1d4ed8; }
  button:disabled { background: #374151; color: #9ca3af; cursor: not-allowed; }
  button.secondary { background: #374151; }
  button.secondary:hover { background: #4b5563; }
  button.danger { background: #b91c1c; }
  button.danger:hover { background: #991b1b; }
  .status-pill {
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: #374151;
    color: #d1d5db;
  }
  .status-pill.running { background: #065f46; color: #6ee7b7; }
  .status-pill.idle { background: #1e3a8a; color: #93c5fd; }
  .spacer { flex: 1; }

  /* 主区域：对话占满，日志可折叠 */
  main {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
    overflow: hidden;
  }
  #chatPane {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  #logPane {
    flex: 0 0 0;
    width: 0;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border-left: 1px solid #262b36;
    overflow: hidden;
    transition: flex-basis 0.15s ease, width 0.15s ease;
  }
  body.show-log #logPane { flex: 0 0 380px; width: 380px; }
  #memoryPane {
    flex: 0 0 0;
    width: 0;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border-left: 1px solid #262b36;
    overflow: hidden;
    transition: flex-basis 0.15s ease, width 0.15s ease;
  }
  body.show-memory #memoryPane { flex: 0 0 420px; width: 420px; }
  #memoryList {
    flex: 0 0 auto;
    max-height: 40%;
    overflow-y: auto;
    border-bottom: 1px solid #262b36;
  }
  .mem-item {
    padding: 6px 12px;
    border-bottom: 1px dashed #1f242e;
    cursor: pointer;
    font-size: 12px;
  }
  .mem-item:hover { background: #1b2029; }
  .mem-item.active { background: #1e3a8a; }
  .mem-item .t { color: #e6e6e6; display: block; }
  .mem-item .m { color: #6b7280; font-size: 11px; }
  #memoryDetail {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 12px;
    min-height: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    white-space: pre-wrap;
    word-break: break-word;
    color: #b6bdc9;
  }
  #contextPane {
    flex: 0 0 0;
    width: 0;
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    border-left: 1px solid #262b36;
    overflow: hidden;
    transition: flex-basis 0.15s ease, width 0.15s ease;
  }
  body.show-context #contextPane { flex: 0 0 460px; width: 460px; }
  #contextBody {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 12px;
    min-height: 0;
    font-size: 12px;
  }
  .ctx-summary {
    padding: 6px 0 10px;
    color: #8b93a1;
    border-bottom: 1px solid #262b36;
    margin-bottom: 8px;
  }
  .ctx-part {
    border: 1px solid #262b36;
    border-radius: 8px;
    margin-bottom: 8px;
    overflow: hidden;
  }
  .ctx-part .hd {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: #12151b;
    cursor: pointer;
    font-size: 12px;
  }
  .ctx-part .hd .tag {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 999px;
    background: #374151;
    color: #d1d5db;
  }
  .ctx-part .hd .tag.system_prompt { background: #7c2d12; color: #fdba74; }
  .ctx-part .hd .tag.memory { background: #14532d; color: #86efac; }
  .ctx-part .hd .tag.task { background: #1e3a8a; color: #93c5fd; }
  .ctx-part .hd .tag.history { background: #4c1d95; color: #c4b5fd; }
  .ctx-part .hd .chars { margin-left: auto; color: #6b7280; font-size: 11px; }
  .ctx-part .bd {
    display: none;
    padding: 8px 10px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    white-space: pre-wrap;
    word-break: break-word;
    color: #b6bdc9;
    max-height: 320px;
    overflow-y: auto;
    border-top: 1px solid #262b36;
  }
  .ctx-part.open .bd { display: block; }
  .pane-title {
    padding: 6px 14px;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #8b93a1;
    background: #12151b;
    border-bottom: 1px solid #262b36;
    flex: 0 0 auto;
  }

  /* 对话区：只显示消息气泡，自动滚到底部 */
  #history {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 14px 16px 8px;
    min-height: 0;
    scroll-behavior: smooth;
  }
  .msg {
    margin: 0 auto 12px;
    max-width: 900px;
    padding: 10px 14px;
    border-radius: 10px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.5;
    font-size: 13.5px;
  }
  .msg .role {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
    opacity: 0.65;
  }
  .msg.user { background: #1e293b; border-left: 3px solid #3b82f6; }
  .msg.assistant { background: #1f2937; border-left: 3px solid #10b981; }
  .msg.system { background: #2a1f14; border-left: 3px solid #f59e0b; }
  .msg.tool { background: #111827; border-left: 3px solid #8b5cf6; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .msg .content { white-space: pre-wrap; }
  .msg .content.collapsed { max-height: 220px; overflow: hidden; position: relative; }
  .msg .content.collapsed::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60px;
    background: linear-gradient(rgba(17,24,39,0), rgba(17,24,39,0.95));
  }
  .msg .toggle {
    display: inline-block; margin-top: 6px; font-size: 11px; color: #93c5fd;
    cursor: pointer; user-select: none;
  }
  .msg .content pre.plain {
    margin: 0; white-space: pre-wrap; word-break: break-word;
    font-family: inherit; font-size: inherit; line-height: 1.55;
  }
  .act-head { margin-bottom: 6px; }
  .badge {
    display: inline-block; padding: 1px 7px; margin-right: 6px; border-radius: 999px;
    font-size: 11px; font-family: ui-monospace, Menlo, monospace;
    background: #334155; color: #e2e8f0;
  }
  .badge.act { background: #1d4ed8; }
  .badge.res { background: #047857; }
  .badge.err { background: #b91c1c; }
  .badge.exit { background: #475569; }
  .kv { display: flex; gap: 8px; font-size: 12.5px; padding: 1px 0; }
  .kv .k { color: #94a3b8; min-width: 96px; flex: 0 0 auto; }
  .kv .v { color: #e5e7eb; word-break: break-word; }
  .kv .v.mono { font-family: ui-monospace, Menlo, monospace; }
  .blk { margin: 6px 0; }
  .blk-title { font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
  .blk-body {
    margin: 0; padding: 8px 10px; border-radius: 6px; background: #0b1220;
    color: #d1d5db; font-size: 12px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; overflow-x: auto;
    max-height: 420px; overflow-y: auto;
  }
  .blk-body.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .empty-hint { color: #6b7280; text-align: center; margin-top: 40px; font-size: 13px; }

  /* 事件日志 */
  #events {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 12px;
    min-height: 0;
  }
  .event {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px;
    padding: 3px 0;
    border-bottom: 1px dashed #1f242e;
    color: #b6bdc9;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .event .ts { color: #6b7280; margin-right: 6px; }
  .event .kind { color: #93c5fd; margin-right: 6px; }

  /* 输入区固定在底部 */
  footer {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    padding: 10px 14px;
    background: #171a21;
    border-top: 1px solid #262b36;
    align-items: flex-end;
  }
  #prompt {
    flex: 1;
    resize: none;
    height: 64px;
    max-height: 200px;
    background: #0f1115;
    border: 1px solid #2c3340;
    color: #e6e6e6;
    padding: 8px 10px;
    border-radius: 8px;
    outline: none;
    line-height: 1.4;
  }
  #prompt:focus { border-color: #3b82f6; }
  .footer-btns { display: flex; flex-direction: column; gap: 6px; }
  .hint { font-size: 11px; color: #6b7280; }
  .err { color: #f87171; }
  @media (max-width: 800px) {
    body.show-log #logPane { flex: 0 0 45%; width: 45%; }
    body.show-memory #memoryPane { flex: 0 0 45%; width: 45%; }
    body.show-context #contextPane { flex: 0 0 55%; width: 55%; }
  }
</style>
</head>
<body>
<header>
  <h1><img class="brand-icon" src="/favicon.svg?v=2" alt="" />agent-services</h1>
  <span id="statusPill" class="status-pill">unknown</span>
  <input id="token" type="password" placeholder="AGENT_WEB_TOKEN" style="width: 200px;" />
  <button id="saveToken" class="secondary">保存 Token</button>
  <div class="spacer"></div>
  <button id="logBtn" class="secondary">日志</button>
  <button id="memoryBtn" class="secondary">记忆</button>
  <button id="contextBtn" class="secondary">上下文</button>
  <button id="clearBtn" class="secondary">清空历史</button>
  <button id="stopBtn" class="danger">停止</button>
  <button id="restartBtn" class="secondary">重启</button>
  <button id="rollbackBtn" class="secondary">回滚</button>
</header>

<main>
  <section id="chatPane">
    <div id="history"><div class="empty-hint">还没有对话，在下方输入指令开始。</div></div>
  </section>
  <section id="logPane">
    <div class="pane-title">事件日志</div>
    <div id="events"></div>
  </section>
  <section id="contextPane">
    <div class="pane-title">上下文拼接（下次调用 DeepSeek 的 messages）</div>
    <div id="contextBody">点击刷新查看。</div>
  </section>
  <section id="memoryPane">
    <div class="pane-title">记忆</div>
    <div id="memoryList"></div>
    <div id="memoryDetail">选择左侧会话查看记忆内容。</div>
  </section>
</main>

<footer>
  <textarea id="prompt" placeholder="输入指令，例如：查看当前目录，列出 python 进程（Ctrl+Enter 发送）"></textarea>
  <div class="footer-btns">
    <button id="sendBtn">发送</button>
    <span class="hint">Ctrl+Enter</span>
  </div>
</footer>

<script>
(function () {
  "use strict";

  var TOKEN_KEY = "agent_web_token";
  var COLLAPSE_CHARS = 1200;

  var state = {
    status: "unknown",
    history: [],
    lastEventId: 0,
    source: null,
    lastError: null,
    lastStop: null,
    sending: false,
    expanded: {},  // 记录用户手动展开的消息索引
    memConv: null
  };

  var el = {
    token: document.getElementById("token"),
    saveToken: document.getElementById("saveToken"),
    statusPill: document.getElementById("statusPill"),
    history: document.getElementById("history"),
    events: document.getElementById("events"),
    prompt: document.getElementById("prompt"),
    sendBtn: document.getElementById("sendBtn"),
    stopBtn: document.getElementById("stopBtn"),
    restartBtn: document.getElementById("restartBtn"),
    rollbackBtn: document.getElementById("rollbackBtn"),
    logBtn: document.getElementById("logBtn"),
    memoryBtn: document.getElementById("memoryBtn"),
    memoryList: document.getElementById("memoryList"),
    memoryDetail: document.getElementById("memoryDetail"),
    contextBtn: document.getElementById("contextBtn"),
    contextBody: document.getElementById("contextBody"),
    clearBtn: document.getElementById("clearBtn")
  };

  function getToken() { return (el.token.value || "").trim(); }

  function loadToken() {
    try { el.token.value = localStorage.getItem(TOKEN_KEY) || ""; } catch (e) {}
  }

  function saveToken() {
    try { localStorage.setItem(TOKEN_KEY, getToken()); } catch (e) {}
    setHint("Token 已保存");
    connectEvents();
  }

  function authHeaders(extra) {
    var h = extra || {};
    var t = getToken();
    if (t) h["Authorization"] = "Bearer " + t;
    return h;
  }

  function setHint(msg, isErr) {
    var pill = el.statusPill;
    if (!pill) return;
    pill.textContent = msg;
    pill.className = "status-pill" + (isErr ? " running" : "");
    setTimeout(function () { renderStatus(state.status); }, 1800);
  }

  var STOP_LABELS = {
    done: "完成",
    cancelled: "已停止",
    max_steps: "达到步数上限",
    max_runtime: "达到运行时长",
    failed: "连续失败",
    repeated_action: "重复动作",
    verification_failed: "验收未通过",
    verification_error: "验收异常",
    context_error: "上下文错误",
    fatal: "异常结束",
    chat_fallback: "回退聊天答复",
    chat_fallback_failed: "回退聊天失败",
    unknown: "结束"
  };

  function renderStatus(status) {
    state.status = status || "unknown";
    var pill = el.statusPill;
    var label = state.status;
    var detail = "";
    if (state.status === "idle" && state.lastStop && state.lastStop.reason) {
      label += " · " + (STOP_LABELS[state.lastStop.reason] || state.lastStop.reason);
      detail = state.lastStop.detail || "";
    }
    pill.textContent = label;
    pill.title = detail;
    pill.className = "status-pill " + (state.status === "running" ? "running" : (state.status === "idle" ? "idle" : ""));
    var running = state.status === "running";
    el.sendBtn.disabled = running;
    el.stopBtn.disabled = !running;
  }

  function roleClass(role) {
    if (role === "user") return "user";
    if (role === "assistant") return "assistant";
    if (role === "system") return "system";
    return "tool";
  }

  function roleLabel(role) {
    if (role === "user") return "你 / 工具结果";
    if (role === "assistant") return "agent";
    if (role === "system") return "system";
    return role || "?";
  }

  function isNearBottom(box) {
    return (box.scrollHeight - box.scrollTop - box.clientHeight) < 60;
  }

  function scrollToBottom() {
    var box = el.history;
    box.scrollTop = box.scrollHeight;
  }

  // ---------- 内容渲染：JSON 动作/结果结构化展示，普通文本保留换行 ----------
  function tryParseJSON(text) {
    var t = (text || "").trim();
    if (!t) return null;
    if (t.charAt(0) !== "{" && t.charAt(0) !== "[") return null;
    try { return JSON.parse(t); } catch (e) { return null; }
  }

  function mkEl(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function addKV(box, key, value, mono) {
    var row = mkEl("div", "kv");
    row.appendChild(mkEl("span", "k", key));
    row.appendChild(mkEl("span", "v" + (mono ? " mono" : ""), value));
    box.appendChild(row);
  }

  function addBlock(box, title, text, mono) {
    if (text == null || text === "") return;
    var wrap = mkEl("div", "blk");
    wrap.appendChild(mkEl("div", "blk-title", title));
    wrap.appendChild(mkEl("pre", "blk-body" + (mono ? " mono" : ""), String(text)));
    box.appendChild(wrap);
  }

  function renderAction(box, obj) {
    var head = mkEl("div", "act-head");
    head.appendChild(mkEl("span", "badge act", obj.action || "?"));
    box.appendChild(head);
    var keys = Object.keys(obj);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (k === "action") continue;
      var v = obj[k];
      if (v == null) continue;
      if (typeof v === "string" && v.indexOf("\n") >= 0) {
        addBlock(box, k, v, k === "command" || k === "content");
      } else if (typeof v === "object") {
        addBlock(box, k, JSON.stringify(v, null, 2), true);
      } else {
        addKV(box, k, String(v), k === "command");
      }
    }
  }

  function renderResult(box, obj) {
    var head = mkEl("div", "act-head");
    var kind = obj.result_of || (obj.error ? "error" : "result");
    head.appendChild(mkEl("span", "badge " + (obj.error ? "err" : "res"), kind));
    if (obj.exit_code != null) head.appendChild(mkEl("span", "badge exit", "exit " + obj.exit_code));
    if (obj.timed_out) head.appendChild(mkEl("span", "badge err", "timeout"));
    box.appendChild(head);

    if (obj.error) addBlock(box, "error", obj.error, false);
    if (obj.command) addBlock(box, "command", obj.command, true);
    if (obj.path) addKV(box, "path", String(obj.path), true);
    if (obj.bytes_written != null) addKV(box, "bytes_written", String(obj.bytes_written), false);
    if (obj.bytes_read != null) addKV(box, "bytes_read", String(obj.bytes_read), false);
    if (obj.stdout) addBlock(box, "stdout", obj.stdout, true);
    if (obj.stderr) addBlock(box, "stderr", obj.stderr, true);
    if (obj.content && !obj.stdout) addBlock(box, "content", obj.content, true);

    var skip = { result_of: 1, error: 1, command: 1, path: 1, bytes_written: 1, bytes_read: 1,
                 stdout: 1, stderr: 1, content: 1, exit_code: 1, timed_out: 1 };
    var keys = Object.keys(obj);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (skip[k]) continue;
      var v = obj[k];
      if (v == null) continue;
      if (typeof v === "object") addBlock(box, k, JSON.stringify(v, null, 2), true);
      else addKV(box, k, String(v), false);
    }
  }

  function renderContent(container, content, role) {
    var obj = tryParseJSON(content);
    if (obj && typeof obj === "object" && !Array.isArray(obj)) {
      if (obj.action) { renderAction(container, obj); return; }
      if (obj.result_of || obj.error) { renderResult(container, obj); return; }
    }
    container.appendChild(mkEl("pre", "plain", content));
  }

  function renderHistory() {
    var box = el.history;
    var list = state.history || [];
    var atBottom = isNearBottom(box);
    box.innerHTML = "";

    if (!list.length) {
      var hint = document.createElement("div");
      hint.className = "empty-hint";
      hint.textContent = "还没有对话，在下方输入指令开始。";
      box.appendChild(hint);
      return;
    }

    var frag = document.createDocumentFragment();
    for (var i = 0; i < list.length; i++) {
      var m = list[i] || {};
      var div = document.createElement("div");
      div.className = "msg " + roleClass(m.role);

      var roleSpan = document.createElement("span");
      roleSpan.className = "role";
      roleSpan.textContent = roleLabel(m.role);
      div.appendChild(roleSpan);

      var content = typeof m.content === "string" ? m.content : JSON.stringify(m.content, null, 2);
      var cdiv = document.createElement("div");
      cdiv.className = "content";
      renderContent(cdiv, content, m.role);

      var long = content.length > COLLAPSE_CHARS;
      var expanded = !!state.expanded[i];
      if (long && !expanded) cdiv.classList.add("collapsed");
      div.appendChild(cdiv);

      if (long) {
        var tg = document.createElement("span");
        tg.className = "toggle";
        tg.textContent = expanded ? "收起" : "展开全文（" + content.length + " 字符）";
        (function (idx, curExpanded) {
          tg.addEventListener("click", function () {
            state.expanded[idx] = !curExpanded;
            renderHistory();
          });
        })(i, expanded);
        div.appendChild(tg);
      }

      frag.appendChild(div);
    }
    box.appendChild(frag);

    if (atBottom || state.status === "running") scrollToBottom();
  }

  function appendEvents(newEvents) {
    if (!newEvents || !newEvents.length) return;
    var box = el.events;
    var atBottom = isNearBottom(box);
    var frag = document.createDocumentFragment();
    for (var i = 0; i < newEvents.length; i++) {
      var ev = newEvents[i] || {};
      var evId = Number(ev.id || 0);
      if (evId && evId <= state.lastEventId) continue;
      if (evId > state.lastEventId) state.lastEventId = evId;
      var div = document.createElement("div");
      div.className = "event";
      var ts = document.createElement("span");
      ts.className = "ts";
      var d = ev.ts ? new Date(ev.ts * 1000) : null;
      ts.textContent = d ? d.toLocaleTimeString() : "";
      var kind = document.createElement("span");
      kind.className = "kind";
      kind.textContent = ev.kind || ev.type || "event";
      div.appendChild(ts);
      div.appendChild(kind);
      var body = ev.message != null ? ev.message : (ev.data != null ? ev.data : "");
      if (typeof body !== "string") {
        try { body = JSON.stringify(body); } catch (e) { body = String(body); }
      }
      div.appendChild(document.createTextNode(body));
      frag.appendChild(div);
    }
    box.appendChild(frag);
    if (atBottom) box.scrollTop = box.scrollHeight;
  }

  function applyState(data) {
    if (!data) return;
    state.lastError = null;
    state.lastStop = data.last_stop || null;
    renderStatus(data.status);
    if (Array.isArray(data.history)) {
      var changed = JSON.stringify(data.history) !== JSON.stringify(state.history);
      state.history = data.history;
      if (changed) renderHistory();
    }
    if (typeof data.last_event_id === "number" && data.last_event_id > state.lastEventId) {
      state.lastEventId = data.last_event_id;
    }
  }

  function fetchState() {
    var url = "/api/state?since_id=" + encodeURIComponent(state.lastEventId);
    fetch(url, { headers: authHeaders() })
      .then(function (resp) {
        if (resp.status === 401 || resp.status === 403) throw new Error("鉴权失败，请检查 Token");
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.json();
      })
      .then(function (data) {
        if (Array.isArray(data.events)) appendEvents(data.events);
        applyState(data);
      })
      .catch(function (err) {
        if (state.lastError !== String(err)) {
          state.lastError = String(err);
          setHint("连接失败: " + err.message, true);
        }
      });
  }

  function connectEvents() {
    if (!getToken()) {
      if (state.source) { state.source.close(); state.source = null; }
      setHint("请先填写 Token", true);
      return;
    }
    if (state.source) { state.source.close(); state.source = null; }
    var url = "/api/events?token=" + encodeURIComponent(getToken()) +
      "&since=" + encodeURIComponent(state.lastEventId);
    var es = new EventSource(url);
    state.source = es;
    es.addEventListener("state", function (e) {
      try { applyState(JSON.parse(e.data)); } catch (err) {}
    });
    es.addEventListener("log", function (e) {
      try { appendEvents([JSON.parse(e.data)]); } catch (err) {}
    });
    es.onopen = function () { setHint("实时连接已建立"); };
    es.onerror = function () {
      if (es.readyState === EventSource.CLOSED) {
        setHint("实时连接已关闭，请检查 Token", true);
      } else {
        setHint("实时连接中断，正在重连…", true);
      }
    };
  }

  function postJSON(path, body) {
    return fetch(path, {
      method: "POST",
      headers: authHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify(body || {})
    }).then(function (resp) {
      return resp.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = { raw: text }; }
        if (!resp.ok) {
          var msg = (data && (data.detail || data.error || data.message)) || ("HTTP " + resp.status);
          throw new Error(typeof msg === "string" ? msg : JSON.stringify(msg));
        }
        return data;
      });
    });
  }

  function sendPrompt() {
    if (state.sending) return;
    var text = (el.prompt.value || "").trim();
    if (!text) return;
    if (!getToken()) { setHint("请先填写 Token", true); return; }
    state.sending = true;
    el.sendBtn.disabled = true;
    postJSON("/api/chat", { prompt: text })
      .then(function () {
        el.prompt.value = "";
        setHint("已发送");
        fetchState();
        scrollToBottom();
      })
      .catch(function (err) { setHint("发送失败: " + err.message, true); })
      .then(function () {
        state.sending = false;
        renderStatus(state.status);
      });
  }

  function doStop() {
    postJSON("/api/stop", {})
      .then(function () { setHint("已请求停止"); fetchState(); })
      .catch(function (err) { setHint("停止失败: " + err.message, true); });
  }

  function doRestart() {
    if (!confirm("确认触发 self_restart？进程将 execv 重启。")) return;
    postJSON("/api/restart", {})
      .then(function () { setHint("已触发重启"); })
      .catch(function (err) { setHint("重启失败: " + err.message, true); });
  }

  function doRollback() {
    if (!confirm("确认从 backups/latest 回滚并重启？")) return;
    postJSON("/api/rollback", {})
      .then(function () { setHint("已触发回滚"); })
      .catch(function (err) { setHint("回滚失败: " + err.message, true); });
  }

  function toggleLog() {
    document.body.classList.remove("show-memory");
    document.body.classList.remove("show-context");
    document.body.classList.toggle("show-log");
    if (document.body.classList.contains("show-log")) {
      var box = el.events;
      box.scrollTop = box.scrollHeight;
    }
  }

  function getJSON(path) {
    return fetch(path, { headers: authHeaders() }).then(function (resp) {
      if (resp.status === 401 || resp.status === 403) throw new Error("鉴权失败，请检查 Token");
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      return resp.json();
    });
  }

  function renderMemoryList(convs) {
    var box = el.memoryList;
    box.innerHTML = "";
    if (!convs || !convs.length) {
      var hint = document.createElement("div");
      hint.className = "mem-item";
      hint.textContent = "暂无记忆";
      box.appendChild(hint);
      return;
    }
    for (var i = 0; i < convs.length; i++) {
      var c = convs[i] || {};
      var div = document.createElement("div");
      div.className = "mem-item" + (c.conv_id === state.memConv ? " active" : "");
      var t = document.createElement("span");
      t.className = "t";
      t.textContent = (c.title || c.conv_id || "(无标题)");
      var m = document.createElement("span");
      m.className = "m";
      m.textContent = (c.conv_id || "") + " · " + (c.updated || "") + " · " + (c.item_count || 0) + " 条";
      div.appendChild(t);
      div.appendChild(m);
      (function (cid) {
        div.addEventListener("click", function () { loadMemoryDetail(cid); });
      })(c.conv_id);
      box.appendChild(div);
    }
  }

  function loadMemoryList() {
    el.memoryList.innerHTML = "";
    getJSON("/api/memory")
      .then(function (data) { renderMemoryList((data && data.conversations) || []); })
      .catch(function (err) { setHint("记忆加载失败: " + err.message, true); });
  }

  function loadMemoryDetail(convId) {
    if (!convId) return;
    state.memConv = convId;
    el.memoryDetail.textContent = "加载中...";
    getJSON("/api/memory/" + encodeURIComponent(convId))
      .then(function (data) {
        el.memoryDetail.textContent = (data && data.markdown) || "(空)";
        loadMemoryList();
      })
      .catch(function (err) { el.memoryDetail.textContent = "加载失败: " + err.message; });
  }

  function toggleMemory() {
    document.body.classList.remove("show-log");
    document.body.classList.remove("show-context");
    document.body.classList.toggle("show-memory");
    if (document.body.classList.contains("show-memory")) loadMemoryList();
  }

  var CTX_LABELS = {
    system_prompt: "系统提示词",
    memory: "长期记忆",
    task: "当前任务",
    history: "对话历史"
  };

  function renderContext(data) {
    var box = el.contextBody;
    box.innerHTML = "";
    if (!data || !data.parts) {
      box.textContent = "暂无上下文";
      return;
    }
    var sum = document.createElement("div");
    sum.className = "ctx-summary";
    sum.textContent = "会话 " + (data.conv_id || "-") + " · 共 " + data.message_count + " 条 message · " + data.total_chars + " 字符";
    box.appendChild(sum);

    for (var i = 0; i < data.parts.length; i++) {
      var p = data.parts[i] || {};
      var wrap = document.createElement("div");
      wrap.className = "ctx-part";

      var hd = document.createElement("div");
      hd.className = "hd";
      var tag = document.createElement("span");
      tag.className = "tag " + (p.kind || "");
      tag.textContent = CTX_LABELS[p.kind] || p.kind || "?";
      var lab = document.createElement("span");
      lab.textContent = "#" + p.index + " " + (p.label || "") + " (" + (p.role || "") + ")";
      var ch = document.createElement("span");
      ch.className = "chars";
      ch.textContent = (p.chars || 0) + " 字符";
      hd.appendChild(tag);
      hd.appendChild(lab);
      hd.appendChild(ch);

      var bd = document.createElement("div");
      bd.className = "bd";
      bd.textContent = p.content || "";

      (function (w) {
        hd.addEventListener("click", function () { w.classList.toggle("open"); });
      })(wrap);

      wrap.appendChild(hd);
      wrap.appendChild(bd);
      box.appendChild(wrap);
    }
  }

  function loadContext() {
    el.contextBody.textContent = "加载中...";
    getJSON("/api/context")
      .then(function (data) { renderContext(data); })
      .catch(function (err) { el.contextBody.textContent = "加载失败: " + err.message; });
  }

  function doClear() {
    if (!confirm("确认清空当前对话历史？旧消息仍保留在 SQLite 中。")) return;
    postJSON("/api/clear", {})
      .then(function () {
        state.history = [];
        state.lastEventId = 0;
        el.events.innerHTML = "";
        renderHistory();
        setHint("历史已清空");
        connectEvents();
      })
      .catch(function (err) { setHint("清空失败: " + err.message, true); });
  }

  function toggleContext() {
    document.body.classList.remove("show-log");
    document.body.classList.remove("show-memory");
    document.body.classList.toggle("show-context");
    if (document.body.classList.contains("show-context")) loadContext();
  }

  function bind() {
    el.saveToken.addEventListener("click", saveToken);
    el.sendBtn.addEventListener("click", sendPrompt);
    el.stopBtn.addEventListener("click", doStop);
    el.restartBtn.addEventListener("click", doRestart);
    el.rollbackBtn.addEventListener("click", doRollback);
    el.logBtn.addEventListener("click", toggleLog);
    el.memoryBtn.addEventListener("click", toggleMemory);
    el.contextBtn.addEventListener("click", toggleContext);
    el.clearBtn.addEventListener("click", doClear);
    el.prompt.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
        e.preventDefault();
        sendPrompt();
      }
    });
    el.token.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); saveToken(); }
    });
  }

  function init() {
    loadToken();
    bind();
    renderStatus("unknown");
    connectEvents();
    // SSE 断线/漏事件时的兜底：低频拉取，保证 running/idle 最终一致。
    setInterval(function () {
      if (getToken()) fetchState();
    }, 5000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
